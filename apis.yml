apis:
- aid: quix:streaming-reader-api
  name: Quix Streaming Reader API (Real-time)
  tags:
  - Streaming
  - Reader
  - Real-Time
  - SignalR
  - WebSocket
  tags_raw:
  - Streaming
  - Reader
  - Real Time
  - SignalR
  - WebSocket
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://quix.io/docs/quix-cloud/apis/streaming-reader-api/overview.html
  baseURL: https://reader-{environmentId}.cloud.quix.io/hub
  properties:
  - url: https://quix.io/docs/quix-cloud/apis/streaming-reader-api/overview.html
    type: Documentation
  - url: asyncapi/quix-asyncapi.yml
    type: AsyncAPI
  description: >-
    Subscribe to live parameter data, events, definitions, active streams, topic metrics, and raw packages
    from Quix topics in real time over a Microsoft SignalR hub (WebSockets, with Long Polling fallback).
    Authenticated with a PAT via accessTokenFactory.
- aid: quix:quix-streams-oss
  name: Quix Streams (Open Source)
  tags:
  - Open-Source
  - Python
  - Kafka
  - Library
  tags_raw:
  - Open Source
  - Python
  - Kafka
  - Library
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://quix.io/docs/quix-streams/introduction.html
  baseURL: https://github.com/quixio/quix-streams
  properties:
  - url: https://quix.io/docs/quix-streams/introduction.html
    type: Documentation
  - url: https://github.com/quixio/quix-streams
    type: SourceCode
  description: >-
    Apache 2.0 open source Python library (pip install quixstreams) for building containerized stream-processing
    applications on Apache Kafka, using a declarative StreamingDataFrame and an Application runtime with
    windowing, stateful processing, streaming joins, and sources/sinks. Requires Python 3.9+; not a hosted
    API - included here as the OSS foundation of the platform.
